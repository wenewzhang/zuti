[package]
name = "zuti"
version = "0.1.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
description = "Zuti - Storage management web service"
license = "MIT"
repository = "https://github.com/yourusername/zuti"

[package.metadata.deb]
maintainer = "Your Name <your.email@example.com>"
copyright = "2026 Your Name"
extended-description = "A web service for disk and storage pool management"
section = "admin"
priority = "optional"
assets = [
    ["target/release/zuti", "usr/bin/zuti", "755"],
    ["certs/server.crt", "etc/zuti/certs/server.crt", "644"],
    ["certs/server.key", "etc/zuti/certs/server.key", "600"],
    ["migrations/*", "usr/share/zuti/migrations/", "644"],
    [".env.example", "etc/zuti/.env.example", "644"],
]
maintainer-scripts = "debian/scripts"
systemd-units = { unit-name = "zuti", enable = false }
depends = "$auto"

[dependencies]
actix-web = { version = "4.13.0", features = ["openssl"] }
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2.2.0", features = ["sqlite", "r2d2"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
chrono = "0.4"
pam = "0.8"
regex = "1"
